# Grade the actual question and answer captured by the browser test.
# Each assertion has its own value and named metric; all must pass.
# No product-factuality check is claimed without a verified product reference.
prompts:
  - "{{answer}}"
providers:
  - echo
# llm-rubric assertions grade with OpenAI by default regardless of which key
# is set — this override is what actually routes grading to Gemini's free
# tier. Swap back to omit this (or point it elsewhere) if a different grader
# is preferred later.
defaultTest:
  options:
    provider: google:gemini-flash-latest
tests:
  - description: Passive earning explanation
    vars:
      question: file://output/question.txt
      answer: file://output/answer.txt
      # Calibrated against 7 real sampled answers (2026-09-12), not assumed.
      # Invariant across all 7: ties earning to ASK via opting into browser-
      # activity sharing through the Permission Agent extension; never
      # frames it as active/repeated task completion. Variable even among
      # clearly-good samples: reward cadence ("weekly" vs. naming a specific
      # day vs. unstated), privacy framing ("anonymized" vs. "private" vs.
      # neither), whether opt-out is mentioned (absent in over half the
      # sample), whether a closing question is present, and whether the
      # literal word "extension" appears at all. None of those are required.
      topic_expectation: >-
        Explains earning with little ongoing effort after initial setup or
        consent, via opting into browser-activity sharing through the
        Permission Agent (extension or otherwise). Accept any wording and
        optional examples. Do not require the words passive, ASK, data
        sharing, or browser extension. Do not require a specific reward
        cadence, a stated privacy mechanism, a mention of opting out, or a
        closing question — real answers vary on all of these. Reject an
        answer that presents repeatedly completing surveys or tasks as the
        definition of passive earning. A comparison with active earning is
        acceptable.
    assert:
      - type: llm-rubric
        metric: relevance
        value: >-
          Question: {{question}}
          Accept an answer that directly addresses this question, even if
          brief or accompanied by relevant context. Reject an unrelated
          answer or generic company introduction that never answers it.
      - type: llm-rubric
        metric: useful_answer
        value: >-
          Question: {{question}}
          Accept a substantive explanation, including reasonable caveats,
          uncertainty about details, and relevant troubleshooting advice.
          Reject an answer consisting only of a refusal, error message,
          expression of uncertainty, or request to try again. Mentioning
          an error or a limitation within a useful answer is acceptable.
      - type: llm-rubric
        metric: topic_understanding
        value: >-
          Question: {{question}}
          Assess the explanation using this expectation:
          {{topic_expectation}}
          Judge meaning rather than keyword presence. Do not demand details
          beyond this expectation or infer undocumented product requirements.
